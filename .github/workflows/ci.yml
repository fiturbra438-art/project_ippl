name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistem-multi-usaha/backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path Cargo.toml -- --check
        working-directory: .
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistem-multi-usaha/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistem-multi-usaha/backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sistem-multi-usaha/backend/ai/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file sistem-multi-usaha/backend/core/Dockerfile sistem-multi-usaha/backend/core
      - run: docker build --file sistem-multi-usaha/backend/ai/Dockerfile sistem-multi-usaha/backend/ai

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
