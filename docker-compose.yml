services:
  db:
    image: postgres:16-alpine
    container_name: usaha_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diatur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diatur}
      POSTGRES_DB: ${POSTGRES_DB:-usaha_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-core:
    build:
      context: ./sistem-multi-usaha/backend/core
      dockerfile: Dockerfile
    container_name: usaha_backend_core
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-usaha_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diatur}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8000}
      WEB_DIR: /app/web
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-onboarding@resend.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MultiUsaha <no-reply@multi-usaha.com>}
    volumes:
      - ./sistem-multi-usaha/frontend/build/web:/app/web:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  backend-ai:
    build:
      context: ./sistem-multi-usaha/backend/ai
      dockerfile: Dockerfile
    container_name: usaha_backend_ai
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-usaha_db}
      PORT: 8001
    volumes:
      - ./sistem-multi-usaha/backend/core/schema_database.sql:/schema/schema_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
    driver: local
